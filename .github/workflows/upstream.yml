name: Upstream releases

# Weekly: an issue when something FrameReader builds on has a newer release than the one it uses: FFmpeg's point
# releases in our native build's series, and the libraries that build links in (security and decoder fixes reach
# FrameReader.Native only when the build moves); BtbN's month-end builds (CI's ffmpeg, pinned in
# .github/actions/btbn-ffmpeg); StyleBro (prereleases, which Dependabot doesn't propose). One issue per release (none if
# one exists, open or closed). ShotDetector's repository watches scenedetect and opencv-python's FFmpeg.
on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  ffmpeg:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: A newer FFmpeg point release?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version our native libraries are built from, and its series (8.1.3 -> 8.1): point releases only, a new
          # major or minor is a decision of its own (the backlog's FFmpeg 9 row).
          ours=$(sed -n 's/^VERSION=//p' tools/native/build-ffmpeg.sh)
          series=${ours%.*}
          latest=$(curl -fsSL --retry 3 https://ffmpeg.org/releases/ | grep -oE "ffmpeg-${series}[.][0-9]+[.]tar[.]xz" \
            | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | sort -V | tail -1)
          echo "Our native build is FFmpeg $ours; the newest $series release is ${latest:-unknown}."
          newer=$(python3 -c 'import sys; v = lambda s: tuple(int(x) for x in s.split(".")); print(v(sys.argv[2]) > v(sys.argv[1]))' "$ours" "${latest:-0}" 2>/dev/null || echo False)
          [ "$newer" = True ] || exit 0
          title="FFmpeg $latest released"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          FFmpeg $latest is out; our native libraries (FrameReader.Native.<rid>) are built from $ours (found by the weekly upstream check).

          Changes: https://git.ffmpeg.org/gitweb/ffmpeg.git/shortlog/refs/tags/n$latest (security fixes are listed at https://ffmpeg.org/security.html).

          To move to it:
          - [ ] In \`tools/native/build-ffmpeg.sh\`: \`VERSION=$latest\` and its \`SHA256\` (of https://ffmpeg.org/releases/ffmpeg-$latest.tar.xz, checked against its .asc signature).
          - [ ] The PR rebuilds the libraries for every platform (native.yml, keyed by the script's hash) and runs the in-process, parity and real-world checks on them.
          - [ ] Update the version in the Native package description, its README and THIRD-PARTY-NOTICES.md, and the CHANGELOG (a patch release).
          EOF
          )"

  # CI's ffmpeg: .github/actions/btbn-ffmpeg pins one of BtbN's month-end releases (BtbN keeps those and prunes the
  # daily ones), FFmpeg 8.1.x and 9.0.x. An issue when the newest month-end release carries a newer point release of
  # either, with the archives' names and SHA-256 to move the pin.
  btbn:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: A newer FFmpeg in BtbN's builds?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action=.github/actions/btbn-ffmpeg/action.yml
          pinned=$(sed -n 's/^ *release=//p' "$action")
          ours81=$(grep -oE '8[.]1[)] tag=n[0-9.]+' "$action" | grep -oE '[0-9.]+$')
          ours90=$(grep -oE '9[.]0[)] tag=n[0-9.]+' "$action" | grep -oE '[0-9.]+$')
          # Month-end releases: autobuild-YYYY-MM-DD-HH-MM whose next day is the 1st.
          release=$(gh api repos/BtbN/FFmpeg-Builds/releases --paginate --jq '.[].tag_name' \
            | grep -E '^autobuild-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$' | sort -r \
            | while read -r t; do
                [ "$(date -u -d "$(echo "$t" | cut -d- -f2-4) + 1 day" +%d)" = 01 ] && { echo "$t"; break; }
              done)
          [ -n "$release" ] || { echo "::error::No month-end release among BtbN's releases"; exit 1; }
          sums=$(curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/checksums.sha256")
          # The archives the action pins: three platforms, static and shared, both series.
          wanted=$(echo "$sums" | grep -E '  ffmpeg-n(8[.]1|9[.]0)[.][0-9]+-[0-9]+-g[0-9a-f]+-(linux64|linuxarm64|win64)-gpl(-shared)?-(8[.]1|9[.]0)[.](tar[.]xz|zip)$' \
            | sort -k2 || true)
          latest81=$(echo "$wanted" | grep -oE 'ffmpeg-n8[.]1[.][0-9]+' | grep -oE '[0-9.]+$' | sort -V | tail -1 || true)
          latest90=$(echo "$wanted" | grep -oE 'ffmpeg-n9[.]0[.][0-9]+' | grep -oE '[0-9.]+$' | sort -V | tail -1 || true)
          echo "The action pins $pinned (FFmpeg $ours81 and $ours90); BtbN's newest month-end release, $release, has ${latest81:-no 8.1} and ${latest90:-no 9.0}."
          newer() { python3 -c 'import sys; v = lambda s: tuple(int(x) for x in s.split(".")); print(v(sys.argv[2]) > v(sys.argv[1]))' "$1" "${2:-0}" 2>/dev/null || echo False; }
          n81=$(newer "$ours81" "$latest81")
          n90=$(newer "$ours90" "$latest90")
          [ "$n81" = True ] || [ "$n90" = True ] || { echo "Up to date."; exit 0; }
          if [ "$(echo "$wanted" | wc -l)" != 12 ]; then
            echo "::warning::$release has $(echo "$wanted" | grep -c . || true) of the 12 archives the action pins"
          fi
          title="BtbN's FFmpeg builds: ${latest81:-$ours81} and ${latest90:-$ours90}"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          # The action's table rows: the archive's name without its extension, and its SHA-256.
          rows=$(echo "$wanted" | sed -E 's/^([0-9a-f]+)  (.*)[.](tar[.]xz|zip)$/          \2) sum=\1 ;;/')
          tag81=$(echo "$wanted" | grep -oE 'ffmpeg-n8[.]1[.][0-9]+-[0-9]+-g[0-9a-f]+' | head -1 | sed 's/^ffmpeg-//' || true)
          tag90=$(echo "$wanted" | grep -oE 'ffmpeg-n9[.]0[.][0-9]+-[0-9]+-g[0-9a-f]+' | head -1 | sed 's/^ffmpeg-//' || true)
          gh issue create --title "$title" --body "$(cat <<EOF
          BtbN's newest month-end release, [$release](https://github.com/BtbN/FFmpeg-Builds/releases/tag/$release), has FFmpeg ${latest81:-(no 8.1)} and ${latest90:-(no 9.0)}; CI's ffmpeg (\`.github/actions/btbn-ffmpeg\`) is pinned to $pinned, FFmpeg $ours81 and $ours90 (found by the weekly upstream check).

          Changes: https://git.ffmpeg.org/gitweb/ffmpeg.git/shortlog/refs/heads/release/8.1 and https://git.ffmpeg.org/gitweb/ffmpeg.git/shortlog/refs/heads/release/9.0.

          To move the pin, in \`.github/actions/btbn-ffmpeg/action.yml\`:
          - [ ] \`release=$release\`
          - [ ] \`8.1) tag=${tag81:-?}\` and \`9.0) tag=${tag90:-?}\`
          - [ ] The table's rows, from the release's [checksums.sha256](https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/checksums.sha256):
          \`\`\`
          $rows
          \`\`\`
          - [ ] The PR's CI downloads every one of them (each archive's SHA-256 is checked; ci.yml, release.yml, realworld-audio.yml and frame-reader-bench.yml use the action), and its results don't change.
          EOF
          )"

  # zlib, dav1d and OpenSSL (its 3.5 LTS series; Linux), linked statically into our FFmpeg libraries: any newer release
  # than build-ffmpeg.sh's.
  libraries:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: zlib, var: ZLIB, index: 'https://zlib.net/fossils/', pattern: 'zlib-[0-9]+([.][0-9]+)+[.]tar[.]gz', notes: 'https://zlib.net/ChangeLog.txt', url: 'https://zlib.net/fossils/zlib-$V.tar.gz' }
          - { name: OpenSSL, var: OPENSSL, index: 'https://github.com/openssl/openssl/releases.atom', pattern: 'openssl-3[.]5[.][0-9]+', notes: 'https://github.com/openssl/openssl/blob/openssl-3.5/CHANGES.md', url: 'https://github.com/openssl/openssl/releases/download/openssl-$V/openssl-$V.tar.gz' }
          - { name: dav1d, var: DAV1D, index: 'https://downloads.videolan.org/pub/videolan/dav1d/', pattern: 'href="[0-9]+([.][0-9]+)+/"', notes: 'https://code.videolan.org/videolan/dav1d/-/releases', url: 'https://downloads.videolan.org/pub/videolan/dav1d/$V/dav1d-$V.tar.xz' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: A newer ${{ matrix.name }}?
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
          INDEX: ${{ matrix.index }}
          PATTERN: ${{ matrix.pattern }}
          NOTES: ${{ matrix.notes }}
          URL: ${{ matrix.url }}
        run: |
          ours=$(sed -n 's/^${{ matrix.var }}=//p' tools/native/build-ffmpeg.sh)
          latest=$(curl -fsSL --retry 3 "$INDEX" | grep -oE "$PATTERN" | grep -oE '[0-9]+([.][0-9]+)+' | sort -V | tail -1)
          echo "Our native build links $NAME $ours; the newest release is ${latest:-unknown}."
          newer=$(python3 -c 'import sys; v = lambda s: tuple(int(x) for x in s.split(".")); print(v(sys.argv[2]) > v(sys.argv[1]))' "$ours" "${latest:-0}" 2>/dev/null || echo False)
          [ "$newer" = True ] || exit 0
          title="$NAME $latest released"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          source=${URL//'$V'/$latest}
          gh issue create --title "$title" --body "$(cat <<EOF
          $NAME $latest is out; our native libraries (FrameReader.Native.<rid>) link $ours in statically (found by the weekly upstream check).

          Changes: $NOTES

          To move to it:
          - [ ] In \`tools/native/build-ffmpeg.sh\`: \`${{ matrix.var }}=$latest\` and \`${{ matrix.var }}_SHA256\` (of $source).
          - [ ] The PR rebuilds the libraries for every platform (native.yml, keyed by the script's hash) and runs the in-process, parity and real-world checks on them.
          - [ ] Update the version in the Native README and THIRD-PARTY-NOTICES.md (and its copyright years), and the CHANGELOG (a patch release).
          EOF
          )"

  # StyleBro (the analyzers and the format tool, one version) is a prerelease: Dependabot's NuGet updater only moves a
  # prerelease to prereleases of the same version or a stable one, so it never proposes 0.x.0-alpha.1 -> 0.y.0-alpha.1.
  stylebro:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: A newer StyleBro on nuget.org?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ours=$(grep -oE 'Include="StyleBro.Analyzers" Version="[^"]+"' Directory.Packages.props | cut -d'"' -f4)
          # NuGet's index lists listed versions in SemVer order, prereleases included.
          latest=$(curl -fsSL --retry 3 https://api.nuget.org/v3-flatcontainer/stylebro.analyzers/index.json | jq -r '.versions[-1]')
          echo "FrameReader uses StyleBro $ours; nuget.org's newest is $latest."
          [ -n "$ours" ] && [ -n "$latest" ] && [ "$latest" != "$ours" ] || exit 0
          # Newer only (SemVer: a release sorts after its prereleases).
          newer=$(python3 -c '
          import sys
          def key(s):
              core, _, pre = s.partition("-")
              ids = [(0, int(x), "") if x.isdigit() else (1, 0, x) for x in pre.split(".")] if pre else []
              return (tuple(int(x) for x in core.split(".")), not pre, ids)
          print(key(sys.argv[2]) > key(sys.argv[1]))' "$ours" "$latest" 2>/dev/null || echo False)
          [ "$newer" = True ] || exit 0
          title="StyleBro $latest released"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          nuget.org has StyleBro $latest; FrameReader uses $ours (found by the weekly upstream check: Dependabot doesn't propose a prerelease's next version).

          Release notes: https://github.com/bisforboman/stylebro/blob/main/CHANGELOG.md (each version's "Upgrading from" section).

          To move to it (one PR):
          - [ ] The analyzers' version in \`Directory.Packages.props\` and the tool's in \`.config/dotnet-tools.json\`.
          - [ ] \`dotnet tool restore\`, \`dotnet tool run bro format FrameReader.slnx\`, then \`--verify-no-changes\` and a build with warnings as errors.
          - [ ] Keep today's style where a new rule or setting would change it across the code (\`.editorconfig\`), and list the files the formatter changed in the PR.
          EOF
          )"
